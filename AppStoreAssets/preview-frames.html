<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store Preview Frames</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 40px;
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 120px; /* Generous vertical spacing so each frame is cleanly isolated for screenshots */
            justify-content: center;
            align-items: center;
        }

        /* App Store / Google Play Canvas Frame Container (Standard 1290x2796 / 9:19.5 Aspect Ratio) */
        .appstore-canvas {
            width: 430px;
            height: 932px;
            background: linear-gradient(180deg, #1e1e24 0%, #0c0c0e 100%);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 24px;
            flex-shrink: 0;
            gap: 50px;
        }

        /* Title & Header Text Area */
        .canvas-header {
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .canvas-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .canvas-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: #a1a1aa;
        }

        /* 1290x2796 Aspect Ratio standard for 6.7" / 6.9" iPhone App Store Display (shrunk to fit canvas) */
        .iphone-frame {
            width: 270px;
            height: 584px;
            background-color: #000000;
            border-radius: 40px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 8px #28282b, 0 0 0 10px #1c1c1e;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            margin-bottom: 0;
        }

        /* Large Raised Frame Variant (No Title, ~25% extends past bottom of canvas) */
        .iphone-frame-large {
            width: 350px;
            height: 757px;
            border-radius: 48px;
            margin-top: 30px;
            margin-bottom: -230px; /* Extends ~25% (230px of 932px height) beyond the bottom edge */
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 0 10px #28282b, 0 0 0 12px #1c1c1e;
        }

        /* Dynamic Island / Notch Mock */
        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 22px;
            background-color: #000000;
            border-radius: 12px;
            z-index: 100;
        }

        /* Screen Canvas Area */
        .screen-canvas {
            width: 100%;
            height: 100%;
            background-color: #0a0a0c;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        .screen-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Oversized Branding White Chevron Overlay with Black Border (Positioned on Card 1 Canvas Level, splitting across frame & card area) */
        .chevron-overlay {
            position: absolute;
            bottom: 40px;
            right: -55px;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.95));
            pointer-events: none;
            opacity: 0.98;
        }

        .chevron-overlay svg {
            width: 320px;
            height: 218px;
        }

        /* Outer black border stroke matching app ZStack black stroke approach */
        .chevron-path-border {
            fill: none;
            stroke: #000000;
            stroke-width: 32px;
            stroke-linecap: square;
            stroke-linejoin: miter;
            stroke-miterlimit: 8;
        }

        /* Inner white main path */
        .chevron-path-main {
            fill: none;
            stroke: #ffffff;
            stroke-width: 20px;
            stroke-linecap: square;
            stroke-linejoin: miter;
            stroke-miterlimit: 8;
        }

        /* Canvas Card Element Overlay 1: Oversized Nearest POI Purple Gradient Button (Positioned across edge of Card 2) */
        .poi-button-overlay {
            position: absolute;
            bottom: 40px;
            right: -30px;
            z-index: 60;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a640fa 0%, #eb59d1 100%);
            border: 4px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 50px rgba(166, 64, 250, 0.65), 0 8px 24px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(15deg);
            pointer-events: none;
        }

        .poi-button-overlay svg {
            width: 60px;
            height: 60px;
            fill: #ffffff;
        }

        /* Canvas Card Element Overlay 2: Oversized Play Audio Control Pill (Positioned across edge of Card 3) */
        .audio-pill-overlay {
            position: absolute;
            bottom: 60px;
            left: -40px;
            z-index: 60;
            background-color: #000000;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50px;
            padding: 22px 38px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 255, 255, 0.15);
            transform: rotate(-10deg);
            pointer-events: none;
        }

        .audio-pill-icon {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        .audio-pill-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .audio-pill-dots {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 4px;
        }

        .audio-pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.9;
        }

        /* Canvas Card Element Overlay 3: Oversized Map Pin Badge (Positioned across edge of Card 4) */
        .mappin-badge-overlay {
            position: absolute;
            bottom: 70px;
            right: -35px;
            z-index: 60;
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 36px;
            padding: 20px 34px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
            transform: rotate(8deg);
            pointer-events: none;
        }

        .mappin-badge-overlay svg {
            width: 32px;
            height: 32px;
            stroke: #a640fa;
            stroke-width: 2.4;
            fill: none;
        }

        .mappin-badge-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* Clean Frame Content Placeholder */
        .frame-placeholder {
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            gap: 12px;
        }

        .frame-number {
            font-size: 48px;
            font-weight: 800;
            color: #ffffff;
            opacity: 0.8;
        }

        .frame-label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Home Indicator Line */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
            opacity: 0.8;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="preview-container">
        
        <!-- Canvas Card 1 -->
        <div class="appstore-canvas">
            <div class="iphone-frame iphone-frame-large">
                <div class="dynamic-island"></div>
                <div class="screen-canvas">
                    <img src="IMG_0747.PNG" alt="Screen 1" class="screen-image">
                </div>
            </div>
            
            <!-- Real App Element: Big Chevron with Black Border (Positioned on the Canvas Card level to split across frame & card area) -->
            <div class="chevron-overlay">
                <svg viewBox="0 0 100 68">
                    <path class="chevron-path-border" d="M 18,19 L 50,49 L 82,19" />
                    <path class="chevron-path-main" d="M 18,19 L 50,49 L 82,19" />
                </svg>
            </div>
        </div>

        <!-- Canvas Card 2 -->
        <div class="appstore-canvas">
            <div class="canvas-header">
                <h2 class="canvas-title">Explore Spots Near You</h2>
                <p class="canvas-subtitle">Discover real-time updates & local posts around your location</p>
            </div>
            <div class="iphone-frame">
                <div class="dynamic-island"></div>
                <div class="screen-canvas">
                    <img src="IMG_0748.PNG" alt="Screen 2" class="screen-image">
                </div>
            </div>
            
            <!-- Real App Element: Nearest POI Purple Gradient Button (Positioned on the Canvas Card level) -->
            <div class="poi-button-overlay">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                </svg>
            </div>
        </div>

        <!-- Canvas Card 3 -->
        <div class="appstore-canvas">
            <div class="canvas-header">
                <h2 class="canvas-title">Share Voice & Audio</h2>
                <p class="canvas-subtitle">Post audio notes, music, and local vibes instantly</p>
            </div>
            <div class="iphone-frame">
                <div class="dynamic-island"></div>
                <div class="screen-canvas">
                    <img src="IMG_0749.PNG" alt="Screen 3" class="screen-image">
                </div>
            </div>
            
            <!-- Real App Element: Play Audio Control Pill (Positioned on the Canvas Card level) -->
            <div class="audio-pill-overlay">
                <svg class="audio-pill-icon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span class="audio-pill-text">Play audio</span>
                <div class="audio-pill-dots">
                    <span class="audio-pill-dot"></span>
                    <span class="audio-pill-dot"></span>
                    <span class="audio-pill-dot"></span>
                </div>
            </div>
        </div>

        <!-- Canvas Card 4 -->
        <div class="appstore-canvas">
            <div class="canvas-header">
                <h2 class="canvas-title">Pin to the Map</h2>
                <p class="canvas-subtitle">Drop posts at exact points of interest and landmarks</p>
            </div>
            <div class="iphone-frame">
                <div class="dynamic-island"></div>
                <div class="screen-canvas">
                    <img src="IMG_0750.PNG" alt="Screen 4" class="screen-image">
                </div>
            </div>
            
            <!-- Real App Element: Map Pin Location Badge (Positioned on the Canvas Card level) -->
            <div class="mappin-badge-overlay">
                <svg viewBox="0 0 24 24">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span class="mappin-badge-text">Nearest Spot</span>
            </div>
        </div>

    </div>

</body>
</html>
